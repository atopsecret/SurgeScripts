name: 戒烟军团客户端会员标志 · Egern
description: 1.0.0 原生版；只改已知 SOAP 响应内原有的完整零值与空日期，HTTP 错误及 SOAP Fault 放行。
author: Pier
homepage: https://github.com/atopsecret/SurgeScripts/tree/main/jyjt
icon: heart.fill
scriptings:

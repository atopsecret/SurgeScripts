  - domain_keyword:
      match: pangolin
      policy: REJECT
  - domain_suffix:
      match: pangle.io
      policy: REJECT
  - domain_suffix:
      match: pglstatp-toutiao.com
      policy: REJECT
  - domain_suffix:
      match: pglstatp-toutiao-b.com
      policy: REJECT
  # 插播广告专用子域；不匹配 *-reading-video 正片主机

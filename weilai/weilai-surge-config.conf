# 蔚来签到 2.1.5 手动配置；合并到对应配置段，不要覆盖已有内容。
# 与模块二选一；本地测试时，将两处 script-path 换为客户端内的新版脚本。

[Script]
# 只抓取已知业务路径；凭据在客户端本地保存，不记录 URL 或响应原文。
蔚来Token抓取 = type=http-request,pattern=^https:\/\/(gateway-front-external\.nio\.com|app\.nio\.com|api\.nio\.com)\/(moat\/10086\/+(n\/c\/award\/|c\/award_cn\/)|(n\/c\/)?(account\/user\/|user\/|profile\/)|app\/api\/|api\/),script-path=https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/weilai/weilai-auto-checkin.js?v=2.1.5,script-update-interval=3600,timeout=10
# 每天 09:00；需要手动执行时运行这条定时任务，不使用伪造域名。
蔚来自动签到 = type=cron,cronexp="0 9 * * *",script-path=https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/weilai/weilai-auto-checkin.js?v=2.1.5,script-update-interval=3600,timeout=30,wake-system=1

[MITM]
hostname = %APPEND% gateway-front-external.nio.com, app.nio.com, api.nio.com

# 引擎：Egern 原生小组件 | 语言：YAML
# 构建：node cainiao-widget/build.mjs
# 运行：Egern 工具 → 模块，导入本文件；扫码登录后填写本地 Env
# 依赖：同目录自包含 JS；无需 MITM、CA 或去广告模块
name: 菜鸟取件 · 原生小组件
description: 1.0.0；突出取件码、驿站与待取数量。支持浅深色和锁屏；失败保留上次结果，首次使用需本地扫码登录。
author: atopsecret
homepage: https://github.com/atopsecret/SurgeScripts/tree/main/cainiao-widget
manual: https://github.com/atopsecret/SurgeScripts/blob/main/cainiao-widget/README.md
icon: shippingbox.fill
env_schema:
  CAINIAO_COOKIE:
    name: 菜鸟登录凭据
    description: 运行本目录本地扫码助手后，粘贴生成的 Cookie 整行。只填在设备本地，不分享含该参数的配置。
    default_value: ''
  REFRESH_MINUTES:
    name: 建议刷新间隔（分钟）
    description: 范围 5–120，默认 15；实际刷新由 iOS 决定。
    default_value: '15'
  LOCKSCREEN_SHOW_CODE:
    name: 锁屏显示取件码
    description: 默认关闭；开启后任何看到锁屏的人都可能看到取件码。
    default_value: 'false'
    options:
      - 'false'
      - 'true'
scriptings:
  - generic:
      name: 菜鸟取件 · 原生脚本
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.0.0
      update_interval: 3600
      timeout: 25
widgets:
  - name: 菜鸟取件
    script_name: 菜鸟取件 · 原生脚本

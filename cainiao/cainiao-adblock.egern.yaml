name: 菜鸟去广告
description: eg-native-20261108-1.2.1；九个精确主机改为 QUIC 或 UDP 443 条件，补仅识别为 UDP 的连接；缓存广告需在 App 内清理，保留原有页面与素材规则。
author: skernelx 来源
homepage: https://github.com/atopsecret/SurgeScripts
rules:
# 广告专用主机可直接拒绝；只按本次抓包确认的主机或广告域后缀匹配。
- domain:
    match: ssp.iytcdn.com
    policy: REJECT
- domain_suffix:
    match: pangolin-sdk-toutiao.com
    policy: REJECT
- domain_suffix:
    match: pangolin-sdk-toutiao-b.com
    policy: REJECT
- domain_suffix:
    match: pangolin-sdk-toutiao1.com
    policy: REJECT
- domain_suffix:
    match: pglstatp-toutiao.com
    policy: REJECT
- domain:
    match: mi.gdt.qq.com
    policy: REJECT
- domain:
    match: sdk.e.qq.com
    policy: REJECT
- domain:
    match: ef-dongfeng.tanx.com
    policy: REJECT
- domain:
    match: df.tanx.com
    policy: REJECT
- domain:
    match: bdlog.tanx.com
    policy: REJECT
- domain:
    match: ipm.atm.youku.com
    policy: REJECT
- domain:
    match: entry-su1.ubixioe.com
    policy: REJECT
- domain:
    match: adx-cfg-u1.ubixioe.com
    policy: REJECT
- domain:
    match: sdk.1rtb.net
    policy: REJECT
- domain:
    match: admonitor-feedback.cn-hangzhou.log.aliyuncs.com
    policy: REJECT
# 仅对需 MITM 的九个精确主机拒绝 UDP/QUIC 443，促使客户端重试 TCP。
# draft QUIC 可能只被归类为 UDP；域名仍须由客户端识别，不能假定 IP 直连一定命中。
- and:
    match:
    - or:
        match:
        - protocol:
            match: quic
        - protocol:
            match: udp
    - dest_port:
        match: '443'
    - or:
        match:
        - domain:
            match: netflow-mtop.cainiao.com
        - domain:
            match: nbcps-mtop.cainiao.com
        - domain:
            match: cn-acs.m.cainiao.com
        - domain:
            match: e2e-mtop.cainiao.com
        - domain:
            match: longquan-mtop.cainiao.com
        - domain:
            match: unet.ucweb.com
        - domain:
            match: p3-sign.douyinpic.com
        - domain:
            match: a1.alibabausercontent.com
        - domain:
            match: ossgw.alicdn.com
    policy: REJECT
# UC 共用主机只拦本次出现的广告曝光路径。
- url_regex:
    match: '^https?://unet\.ucweb\.com(?::[0-9]+)?/v3/ad/show/toutiao/?(?:\?|$)'
    policy: REJECT
# 共享图片 CDN：限定菜鸟 UA、两次抓包的目录和素材格式，覆盖轮换 ID。
- and:
    match:
    - url_regex:
        match: '^https://p3-sign\.douyinpic\.com(?::[0-9]+)?/tos-cn-p-0051(?:-ce)?/[A-Za-z0-9_-]+~tplv-noop\.image(?:\?|$)'
    - or:
        match:
        - user_agent:
            match: 'Cainiao4iPhone/*'
        - user_agent:
            match: '*com.cainiao.cnwireless*'
    policy: REJECT
# Page_Screen_Cpm 日志确认的自营开屏素材目录；覆盖视频与独立备用封面。
- and:
    match:
    - url_regex:
        match: '^https://a1\.alibabausercontent\.com(?::[0-9]+)?/prod/feupload/user/7clgu/[A-Za-z0-9_-]+\.mp4_\.mp4(?:\?|$)'
    - or:
        match:
        - user_agent:
            match: 'Cainiao4iPhone/*'
        - user_agent:
            match: '*com.cainiao.cnwireless*'
    policy: REJECT
- and:
    match:
    - url_regex:
        match: '^https://ossgw\.alicdn\.com(?::[0-9]+)?/creatives-assets/prod/feupload/user/7clgu/[A-Za-z0-9_-]+\.jpg(?:\?|$)'
    - or:
        match:
        - user_agent:
            match: 'Cainiao4iPhone/*'
        - user_agent:
            match: '*com.cainiao.cnwireless*'
    policy: REJECT
scriptings:
- http_response:
    name: 菜鸟去广告原生处理
    match: '^https://(?:(?:cn-acs\.m|e2e-mtop)\.cainiao\.com(?::[0-9]+)?/gw/mtop\.cainiao\.app\.e2e\.engine\.page\.fetch(?:\.cn)?(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$)|longquan-mtop\.cainiao\.com(?::[0-9]+)?/gw/mtop\.com\.cainiao\.longquan\.place\.getpageresourcecontent\.cn(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$))'
    script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao/cainiao-adblock.egern.js?v=eg-native-20261108-1.2.1
    body_required: true
    binary_body: true
    max_size: 2097152
    update_interval: 3600
    timeout: 30
- generic:
    name: 菜鸟去广告诊断
    script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao/cainiao-adblock.egern.js?v=eg-native-20261108-1.2.1
    update_interval: 3600
    timeout: 30
map_locals:
- match: '^https://nbcps-mtop\.cainiao\.com(?::[0-9]+)?/gw/mtop\.cainiao\.nbcps\.presentation\.fetch\.cn(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$)'
  status_code: 404
  headers:
    Content-Type: text/plain; charset=utf-8
    X-Cainiao-Cleaner-Version: eg-native-20261108-1.2.1
  body: ''
- match: '^https://netflow-mtop\.cainiao\.com(?::[0-9]+)?/gw/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.index(?:\.cn)?(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$)'
  status_code: 404
  headers:
    Content-Type: text/plain; charset=utf-8
    X-Cainiao-Cleaner-Version: eg-native-20261108-1.2.1
  body: ''
- match: '^https://cn-acs\.m\.cainiao\.com(?::[0-9]+)?/gw/mtop\.cainiao\.adkeyword\.get\.cn(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$)'
  status_code: 404
  headers:
    Content-Type: text/plain; charset=utf-8
    X-Cainiao-Cleaner-Version: eg-native-20261108-1.2.1
  body: ''
- match: '^https://(?:cn-acs\.m|netflow-mtop)\.cainiao\.com(?::[0-9]+)?/gw/mtop\.cainiao\.guoguo\.nbnetflow\.ads\.m?show(?:\.cn)?(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$)'
  status_code: 404
  headers:
    Content-Type: text/plain; charset=utf-8
    X-Cainiao-Cleaner-Version: eg-native-20261108-1.2.1
  body: ''
- match: '^https://cn-acs\.m\.cainiao\.com(?::[0-9]+)?/gw/mtop\.cainiao\.adx\.flyad\.getad\.cn(?:/[0-9]+(?:\.[0-9]+)*)?/?(?:\?|$)'
  status_code: 404
  headers:
    Content-Type: text/plain; charset=utf-8
    X-Cainiao-Cleaner-Version: eg-native-20261108-1.2.1
  body: ''
mitm:
  hostnames:
    includes:
    - netflow-mtop.cainiao.com
    - nbcps-mtop.cainiao.com
    - cn-acs.m.cainiao.com
    - e2e-mtop.cainiao.com
    - longquan-mtop.cainiao.com
    - unet.ucweb.com
    - p3-sign.douyinpic.com
    - a1.alibabausercontent.com
    - ossgw.alicdn.com

name: 京东去广告（Egern 原生）
description: 2.0.0；十二类接口，补全个人页、订单、新品与物流变体；严格匹配、原字节回退，保留未知工具和商品图片。
author: skernelx · FFDNS
homepage: https://github.com/atopsecret/SurgeScripts
scriptings:
- http_response:
    name: 京东去广告原生处理
    match: '^https?://api\.m\.jd\.com(?::[0-9]+)?/client\.action(?:\?|$)'
    script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/jd/jd-ad-block.egern.js?v=2.0.0
    body_required: true
    binary_body: true
    max_size: 2097152
    timeout: 30
    update_interval: 3600
- generic:
    name: 京东去广告诊断
    script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/jd/jd-ad-block.egern.js?v=2.0.0
    timeout: 30
    update_interval: 3600
rules:
- url_regex:
    match: '^http://\w{32}\.jddebug\.com/diagnose\?'
    policy: REJECT
- url_regex:
    match: '^https?://apk\.360buyimg\.com/mpaas2-public/[^/]*/(short_video|XJI-short-video)'
    policy: REJECT
- url_regex:
    match: '^https?://(bdsp-x|dsp-x)\.jd\.com/adx/'
    policy: REJECT
- url_regex:
    match: '^https?://api\.m\.jd\.com(?::[0-9]+)?/client\.action\?(?:(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?&)*functionId=getWidgetV1052(?:&(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?)*$'
    policy: REJECT
map_locals:
- match: '^https?://api\.m\.jd\.com(?::[0-9]+)?/client\.action\?(?:(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?&)*functionId=queryMaterialAdverts(?:&(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?)*$'
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: '^https?://m\.360buyimg\.com/mobilecms/s1125x2436_jfs'
  status_code: 200
  body: ''
- match: '^https?://api\.m\.jd\.com(?::[0-9]+)?/client\.action\?(?:(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?&)*functionId=queryPagePopWindow(?:&(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?)*$'
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: '^https?://api\.m\.jd\.com(?::[0-9]+)?/\?(?:(?!loginType(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?&)*loginType=11(?:&(?!loginType(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?)*$'
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: '^https?://api\.m\.jd\.com(?::[0-9]+)?/client\.action\?(?:(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?&)*functionId=(cartCouponRecommendGoods|intelligentRecommendSku|obtainGrowingInfo|recommendShop|searchBoxWord|stationPullService|uniformRecommend|uniformRecommend0|uniformRecommend6)(?:&(?!functionId(?:=|&|$))[A-Za-z0-9_.~-]+(?:=[^&#]*)?)*$'
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
mitm:
  hostnames:
    includes:
    - api.m.jd.com
    - m.360buyimg.com
    - apk.360buyimg.com
    - bdsp-x.jd.com
    - dsp-x.jd.com

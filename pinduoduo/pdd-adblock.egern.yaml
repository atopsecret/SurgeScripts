name: 拼多多去广告（Egern 原生）
description: eg-native-20261105-r1；原生页面净化、开屏空响应和 UA 双条件素材拦截；单域 QUIC 阻断，不封锁整个商品图片 CDN。
author: skernelx · FFDNS · RuCu6 · ZenmoFeiShi
homepage: https://github.com/atopsecret/SurgeScripts/tree/main/pinduoduo
# 来源与范围见本目录 README；不修改主配置 DNS、IPv6 或全局 QUIC。
rules:
- and:
    match:
    - url_regex:
        match: '^http://(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)/d[0-9]?(?:\?|$)'
    - user_agent:
        match: '*com.xunmeng.pinduoduo*'
    policy: REJECT
- and:
    match:
    - url_regex:
        match: '^http://\[[0-9a-fA-F:]+\]/d[0-9]?\?'
    - user_agent:
        match: '*com.xunmeng.pinduoduo*'
    policy: REJECT
- and:
    match:
    - domain:
        match: api.pinduoduo.com
    - protocol:
        match: quic
    policy: REJECT
- and:
    match:
    - url_regex:
        match: '^http://[^/]+/v3/d\?(?:[^#]*&)?type=addrs(?:&|$)'
    - user_agent:
        match: '*pinduoduo*'
    policy: REJECT
- domain:
    match: promotion-2.pddpic.com
    policy: REJECT
- domain:
    match: video-snapshot01.pddpic.com
    policy: REJECT
- domain:
    match: titan.pinduoduo.com
    policy: REJECT
- domain:
    match: xg.pinduoduo.com
    policy: REJECT
- domain:
    match: apm.pinduoduo.com
    policy: REJECT
- domain:
    match: apm-a.pinduoduo.com
    policy: REJECT
- domain:
    match: th.pinduoduo.com
    policy: REJECT
- domain:
    match: th-a.pinduoduo.com
    policy: REJECT
- domain:
    match: th-b.pinduoduo.com
    policy: REJECT
- domain:
    match: ta.pinduoduo.com
    policy: REJECT
- domain:
    match: ta-a.pinduoduo.com
    policy: REJECT
- domain:
    match: meta.pinduoduo.com
    policy: REJECT
scriptings:
- http_response:
    name: 拼多多页面原生净化
    match: '^https?://[^/]+/(api/(alexa/homepage/hub|philo/personal/hub|oak/integration/render|aristotle/order_list_v4)(?:\?|$)|order/|search(?:\?|$))'
    script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/pinduoduo/pdd-ad-block.egern.js?v=eg-native-20261105-r1
    body_required: true
    max_size: 131072
    update_interval: 3600
    timeout: 30
- generic:
    name: 拼多多去广告诊断

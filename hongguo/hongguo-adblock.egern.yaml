# 引擎：Egern 2.21 | 格式：原生 YAML 模块
# 构建：无需编译
# 运行：在 Egern 模块管理中添加本文件的远程链接
# 依赖：仅广告接口空响应需要开启 MITM 并信任 Egern CA
# 来源：HongGuo Lite（Minis）、home-dns-adblock（abclq）；保留原作者 MIT 通知。
# 机制：精确拒绝原模块广告/上报主机；广告与正片视频子域分开处理。
# 差异：不拒绝 dns.alidns.com/doh.pub，不解密整个 snssdk.com。
name: 红果短剧去广告（Egern 原生）
description: 78 条广告与上报规则；保留正片视频主机，不阻断主配置公共 DNS。穿山甲接口空 JSON 需要 Egern CA。
author: skernelx · Minis · abclq
homepage: https://github.com/atopsecret/SurgeScripts/tree/main/hongguo
manual: https://github.com/atopsecret/SurgeScripts/blob/main/hongguo/README.md
icon: shield.lefthalf.filled
rules:

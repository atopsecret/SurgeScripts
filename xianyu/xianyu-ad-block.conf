# 闲鱼APP去广告 - Surge 配置文件
# 基于抓包分析，精准屏蔽闲鱼各类广告
# 
# 作者: Kiro Assistant
# 版本: v1.0.0
# 更新时间: 2026-01-06

# ==================== 脚本配置 ====================
[Script]

# 开屏广告拦截
闲鱼去广告-开屏 = type=http-response,pattern=^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.taobao\.idlecommerce\.splash\.async\.ads,requires-body=1,max-size=0,script-path=xianyu-ad-block.js,timeout=30

# 广告上报拦截
闲鱼去广告-上报 = type=http-response,pattern=^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.idle\.idleadv\.app\.launch\.report,requires-body=1,max-size=0,script-path=xianyu-ad-block.js,timeout=30

# 广告场景恢复拦截
闲鱼去广告-场景 = type=http-response,pattern=^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.idle\.idleadv\.scene\.restore,requires-body=1,max-size=0,script-path=xianyu-ad-block.js,timeout=30

# 悬浮球/弹窗广告拦截
闲鱼去广告-悬浮 = type=http-response,pattern=^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.taobao\.idle\.user\.strategy\.list,requires-body=1,max-size=0,script-path=xianyu-ad-block.js,timeout=30

# 首页Tab广告追踪清理
闲鱼去广告-追踪 = type=http-response,pattern=^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.taobao\.idlehome\.home\.circle\.list,requires-body=1,max-size=0,script-path=xianyu-ad-block.js,timeout=30

# ==================== URL重写规则 ====================
[URL Rewrite]

# 直接拒绝的广告请求（可选，更激进的拦截方式）
# ^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.taobao\.idlecommerce\.splash - reject-dict
# ^https?://acs\.m\.(goofish|taobao)\.com/gw/mtop\.idle\.idleadv - reject-200

# ==================== MITM 配置 ====================
[MITM]
# 闲鱼相关域名
hostname = %APPEND% acs.m.goofish.com, acs.m.taobao.com, gw.m.goofish.com, gw.m.taobao.com

# ==================== 使用说明 ====================
# 
# 🎯 安装步骤：
# 
# 1️⃣ 添加脚本
#    - 将 xianyu-ad-block.js 放到 Surge 脚本目录
#    - 或使用远程链接引用
#
# 2️⃣ 添加配置
#    - 将上述 [Script] 和 [MITM] 内容添加到你的 Surge 配置
#    - 重新加载 Surge 配置
#
# 3️⃣ 验证效果
#    - 完全关闭闲鱼APP
#    - 重新打开闲鱼
#    - 开屏广告应该被跳过
#
# 📋 屏蔽内容：
#    ✅ 开屏广告（启动时的全屏广告）
#    ✅ 首页悬浮球广告
#    ✅ 弹窗广告
#    ✅ 广告追踪参数
#
# ⚠️ 注意事项：
#    - 确保 MITM 功能已开启
#    - 确保已信任 Surge CA 证书
#    - 如遇问题可关闭脚本排查
#
# 🔧 远程引用方式：
#    将 script-path 改为 GitHub Raw 链接：
#    script-path=https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/xianyu/xianyu-ad-block.js


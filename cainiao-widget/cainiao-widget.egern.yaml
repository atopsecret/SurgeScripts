# 引擎：Egern 原生小组件 | 语言：YAML
# 构建：node cainiao-widget/build.mjs
# 运行：手机更新同模块；官方组件真实查询被捕获后运行本组件
# 依赖：同目录自包含 JS；四个精确 MTOP 主机和一个官方小组件查询主机
name: 菜鸟取件
description: 1.4.0 · 待取数量与更新时间，奶油橙配色、深色适配。连接有效时无需打开菜鸟 App；会话失效后需重新接入，实际刷新由 iOS 决定。
author: atopsecret
homepage: https://github.com/atopsecret/SurgeScripts/tree/main/cainiao-widget
manual: https://github.com/atopsecret/SurgeScripts/blob/main/cainiao-widget/README.md
icon: shippingbox.fill
env_schema:
  CONNECTION_MODE:
    name: 连接开关
    description: auto 独立刷新待取数量；off 会清除本机连接，之后需要重新接入。
    default_value: 'auto'
    options:
      - 'auto'
      - 'off'
  REFRESH_MINUTES:
    name: 建议刷新间隔（分钟）
    description: 范围 5–120，默认 15；实际刷新由 iOS 决定。
    default_value: '15'
scriptings:
  - http_request:
      name: 菜鸟 App 会话采集
      match: '^https://(?:h5api\.m\.taobao\.com|acs\.m\.taobao\.com|cn-acs\.m\.cainiao\.com|e2e-mtop\.cainiao\.com)(?::443)?/(?:h5/(?:mtop(?:\.[A-Za-z0-9_-]+)+|com\.taobao\.mtop\.[mM][lL]ogin[uU]nit[sS]ervice\.(?:[lL]ogin|[aA]uto[lL]ogin|[lL]ogout))/[0-9]+(?:\.[0-9]+)*|gw/(?:mtop(?:\.[A-Za-z0-9_-]+)+|com\.taobao\.mtop\.[mM][lL]ogin[uU]nit[sS]ervice\.(?:[lL]ogin|[aA]uto[lL]ogin|[lL]ogout))(?:/(?:[0-9]+(?:\.[0-9]+)*|\*))?)/?(?:\?[^#\s]*)?$'
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.4.0
      body_required: false
      update_interval: 3600
      timeout: 5
  - http_response:
      name: 菜鸟官方小组件专用会话
      match: '^https://(?:h5api\.m\.taobao\.com|acs\.m\.taobao\.com|cn-acs\.m\.cainiao\.com|e2e-mtop\.cainiao\.com)(?::443)?/(?:h5/mtop\.[cC][aA][iI][nN][iI][aA][oO]\.[gG][uU][oO][gG][uU][oO]\.[wW][iI][dD][gG][eE][tT]\.[tT][oO][kK][eE][nN]\.[gG][eE][tT]\.[cC][nN]/1\.0|gw/mtop\.[cC][aA][iI][nN][iI][aA][oO]\.[gG][uU][oO][gG][uU][oO]\.[wW][iI][dD][gG][eE][tT]\.[tT][oO][kK][eE][nN]\.[gG][eE][tT]\.[cC][nN](?:/(?:1\.0|\*))?)/?(?:\?[^#\s]*)?$'
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.4.0
      env:
        CW_OFFICIAL_TOKEN: 'true'
      body_required: true
      binary_body: true
      max_size: 262144
      update_interval: 3600
      timeout: 5
  - http_request:
      name: 菜鸟官方小组件查询参数
      match: '^https://guoguouser\.cainiao\.com(?::443)?/com\.cainiao\.guoguo\.guoguouser\.widget\.WidgetLogisticsService/1\.0\.0/queryWidgetDetailsV2$'
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.4.0
      body_required: true
      binary_body: true
      max_size: 262144
      update_interval: 3600
      timeout: 5
  - generic:
      name: 菜鸟取件 · 原生脚本
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.4.0
      env:
        CW_COUNT_ONLY: 'true'
      update_interval: 3600
      timeout: 25
widgets:
  - name: 菜鸟取件
    script_name: 菜鸟取件 · 原生脚本
mitm:
  hostnames:
    includes:
      - h5api.m.taobao.com
      - acs.m.taobao.com
      - cn-acs.m.cainiao.com
      - e2e-mtop.cainiao.com
      - guoguouser.cainiao.com

# 引擎：Egern 原生小组件 | 语言：YAML
# 构建：node cainiao-widget/build.mjs
# 运行：导入模块并信任本人 Egern CA；打开淘宝／菜鸟 App 快递列表，再运行组件
# 依赖：同目录自包含 JS；仅声明四个精确 MTOP 主机，不依赖去广告或独立诊断模块
name: 菜鸟取件 · 原生小组件
description: 1.2.1；保留 App 同次真实 Cookie，只补 native UID 并严格验证个人身份和完整列表；首次失败不误报 App 登录过期。同一组件显示固定失败阶段，无需电脑、HAR 或另装诊断。
author: atopsecret
homepage: https://github.com/atopsecret/SurgeScripts/tree/main/cainiao-widget
manual: https://github.com/atopsecret/SurgeScripts/blob/main/cainiao-widget/README.md
icon: shippingbox.fill
env_schema:
  CONNECTION_MODE:
    name: 登录连接方式
    description: auto 优先自动捕获；manual 仅使用下方手动参数；off 禁用捕获，组件下次执行清除本机登录态与快照。
    default_value: 'auto'
    options:
      - 'auto'
      - 'manual'
      - 'off'
  CAINIAO_COOKIE:
    name: 手动登录凭据（可选）
    description: 默认无需填写。未捕获自动登录态时可备用；只保存在自己设备，不分享含此值的配置。
    default_value: ''
  REFRESH_MINUTES:
    name: 建议刷新间隔（分钟）
    description: 范围 5–120，默认 15；实际刷新由 iOS 决定。
    default_value: '15'
  LOCKSCREEN_SHOW_CODE:
    name: 锁屏显示取件码
    description: 默认关闭；开启后任何看到锁屏的人都可能看到取件码。
    default_value: 'false'
    options:
      - 'false'
      - 'true'
scriptings:
  - http_request:
      name: 菜鸟 App 会话采集
      match: '^https://(?:h5api\.m\.taobao\.com|acs\.m\.taobao\.com|cn-acs\.m\.cainiao\.com|e2e-mtop\.cainiao\.com)(?::443)?/(?:h5/mtop(?:\.[A-Za-z0-9_-]+)+/[0-9]+(?:\.[0-9]+)*|gw/mtop(?:\.[A-Za-z0-9_-]+)+(?:/(?:[0-9]+(?:\.[0-9]+)*|\*))?)/?(?:\?[^#\s]*)?$'
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.2.1
      body_required: false
      update_interval: 3600
      timeout: 5
  - generic:
      name: 菜鸟取件 · 原生脚本
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.2.1
      update_interval: 3600
      timeout: 25
  - generic:
      name: 菜鸟连接状态
      script_url: https://raw.githubusercontent.com/atopsecret/SurgeScripts/main/cainiao-widget/cainiao-widget.egern.js?v=1.2.1
      env:
        CAINIAO_DIAGNOSTIC: 'true'
      update_interval: 3600
      timeout: 5
widgets:
  - name: 菜鸟取件
    script_name: 菜鸟取件 · 原生脚本
mitm:
  hostnames:
    includes:
      - h5api.m.taobao.com
      - acs.m.taobao.com
      - cn-acs.m.cainiao.com
      - e2e-mtop.cainiao.com

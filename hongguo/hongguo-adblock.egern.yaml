map_locals:
  - match: '^https://(?:[A-Za-z0-9-]+\.)*pangolin-sdk-toutiao(?:-b|1)?\.com(?::443)?/api/ad/union/sdk/'
    status_code: 200
    headers:
      Content-Type: application/json
      Cache-Control: no-store
    body: '{}'
mitm:
  hostnames:
    includes:
      - '*.pangolin-sdk-toutiao.com'
      - '*.pangolin-sdk-toutiao-b.com'
      - '*.pangolin-sdk-toutiao1.com'
